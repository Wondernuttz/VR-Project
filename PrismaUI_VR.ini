[Laser]
; Adaptive One Euro smoothing for the OCU aim pose used by Prisma panels.
; Set to 0 to restore the raw controller ray.
bSmoothing=1
fDirectionMinCutoffHz=4.0
fDirectionBeta=0.35
fPositionMinCutoffHz=6.0
fPositionBeta=12.0
fDerivativeCutoffHz=1.0
fSnapAngleDegrees=60.0
fSnapDistanceMeters=0.35
fMaxGapSeconds=0.25

[Scrolling]
; Hold the trigger for half a second inside a scroll pane, then use the same
; hand's thumbstick to scroll it. During a panel grab, the opposite stick controls depth.
; Values are time based, so speed does not change with FPS.
fThumbstickDeadzone=0.18
fPixelsPerSecond=1000.0
